name: CI Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20.x'
      - name: Go mod tidy
        run: go mod tidy
      - name: Build
        run: go build ./...
      - name: Run e2e tests
        run: |
          if [ -f test/e2e/run_test.sh ]; then
            ./test/e2e/run_test.sh --build-image-clean || true
          fi
      - name: Save logs
        if: always()
        run: |
          mkdir -p artifacts
          echo "GO version: $(go version)" > artifacts/build.log
          go env >> artifacts/build.log
          echo "--- Build Directory ---" >> artifacts/build.log
          ls -la >> artifacts/build.log
          echo "--- e2e logs ---" >> artifacts/build.log
          if [ -d test/e2e ]; then
            find test/e2e -name "*.log" -exec cat {} \; >> artifacts/build.log 2>/dev/null || true
          fi
      - name: Upload build logs
        uses: actions/upload-artifact@v3
        with:
          name: build-logs
          path: artifacts
